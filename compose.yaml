name: project20

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: project20-app
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "8020:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-image_api}
      POSTGRES_USER: ${DB_USERNAME:-image_api}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-image_api_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  queue:
    image: project20-app
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/html/.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - php
      - artisan
      - queue:work
      - redis
      - --sleep=1
      - --tries=3
      - --timeout=120
    restart: unless-stopped

volumes:
  postgres_data:
